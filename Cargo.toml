[package]
name = "blitz"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A cargo front-end with a whole-build cache and a per-crate content-addressed cache"
publish = false

[dependencies]
anyhow = "1"
blake3 = { version = "1", features = ["mmap"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
